[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tiny-aya-particle-vibe"
version = "0.1.0"
description = "Train and sample Tiny Aya Global text vibes with ParticleGAN 0.12.0"
requires-python = ">=3.11"
dependencies = [
    "particle-sliders-vibe[text] @ git+https://github.com/HyperGAN/particle-sliders.git@7e113f67879a7e9c660d0622487e4953a4b46756#subdirectory=packages/particle-sliders-vibe",
]

[project.scripts]
tiny-aya-vibe = "tiny_aya_vibe:main"

[tool.setuptools]
py-modules = ["tiny_aya_vibe"]
