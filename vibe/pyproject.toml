[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tiny-aya-particle-vibe"
version = "0.1.0"
description = "Train and sample Tiny Aya Global text vibes with ParticleGAN 0.12.0"
requires-python = ">=3.11"
dependencies = [
    "particle-sliders-vibe[text] @ git+https://github.com/HyperGAN/particle-sliders.git@e50158f3c4f14cc1245271dbe4fb1011b695688d#subdirectory=packages/particle-sliders-vibe",
]

[project.scripts]
tiny-aya-vibe = "tiny_aya_vibe:main"

[tool.setuptools]
py-modules = ["tiny_aya_vibe"]
